<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f4ef" />
  <title>Lector PDF</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-pdf="light">

  <!-- ================= BIBLIOTECA ================= -->
  <section id="library" class="view active">
    <header class="topbar">
      <div class="brand">
        <div class="mark">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
          </svg>
        </div>
        <h1 id="lib-title">Mi biblioteca</h1>
      </div>
      <div class="actions">
        <button class="icon-btn" id="btn-search" title="Buscar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        </button>
        <button class="icon-btn" id="btn-folders" title="Carpetas">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        </button>
        <button class="icon-btn" id="btn-settings" title="Ajustes">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 7 19.4a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 15a1.7 1.7 0 0 0-1.6-1H1.3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 3 9a1.7 1.7 0 0 0-.3-1.9L2.6 7A2 2 0 1 1 5.4 4.2l.1.1A1.7 1.7 0 0 0 7.4 4.6 1.7 1.7 0 0 0 8.3 3V2.9a2 2 0 1 1 4 0V3a1.7 1.7 0 0 0 .9 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9c.3.6.9 1 1.6 1h.1a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.6 1z"/></svg>
        </button>
      </div>
    </header>

    <div class="filters" id="folder-chips">
      <button class="chip active" data-folder="all">Todos</button>
    </div>

    <div class="search-wrap hidden" id="search-wrap">
      <input id="search-input" type="search" placeholder="Buscar por título o autor" autocomplete="off" />
    </div>

    <div id="scroll-library">
      <div id="book-grid" class="grid"></div>
      <div id="empty-state" class="empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
        <h2>Tu biblioteca está vacía</h2>
        <p>Toca el botón <b>+</b> para agregar un PDF de tu teléfono.<br />Los libros se guardan dentro de la app y se leen sin internet.</p>
      </div>
    </div>

    <button class="fab" id="fab" title="Agregar PDF">+</button>
    <input type="file" id="file-input" accept="application/pdf,.pdf" multiple hidden />
  </section>

  <!-- ================= LECTOR ================= -->
  <section id="reader" class="view">
    <header class="reader-bar">
      <button class="icon-btn" id="r-back" title="Volver">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <div class="r-title">
        <span id="r-name">—</span>
        <small id="r-page">—</small>
      </div>
      <button class="icon-btn" id="r-toc" title="Índice">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
      </button>
      <button class="icon-btn" id="r-search" title="Buscar en el libro">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
      <button class="icon-btn" id="r-more" title="Más">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
      </button>
    </header>

    <div class="pages" id="pages">
      <div class="pages-inner reader-filter-canvas" id="pages-inner"></div>
    </div>

    <div class="loading-overlay" id="reader-loading">
      <div class="spinner"></div>
      <div>Abriendo libro…</div>
    </div>

    <footer class="reader-foot">
      <button class="step" id="r-prev">◀</button>
      <input type="range" id="r-slider" min="1" max="1" value="1" step="1" />
      <span class="label" id="r-page-label">1 / 1</span>
      <button class="step" id="r-next">▶</button>
      <button class="step" id="r-tts" title="Leer en voz alta">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      </button>
    </footer>
  </section>

  <div id="modal-root"></div>
  <div class="toast" id="toast"></div>

  <script src="vendor/pdf.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
